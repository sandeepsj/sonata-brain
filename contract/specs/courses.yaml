area: Courses (today)
suite: baseline
background:
  - use: baseline-admin

cases:
  - id: CRS-001
    title: A course is created from its name; its id is the name
    req: [REQ-040.AC1]
    steps:
      - POST: /api/courses
        auth: admin
        body: { name: Violin }
        expect:
          status: 200
          body: { name: Violin, id: Violin }

  - id: CRS-002
    title: All courses are listed
    req: [REQ-040.AC2]
    steps:
      - POST: /api/courses
        auth: admin
        body: { name: Violin }
        expect: { status: 200 }
      - POST: /api/courses
        auth: admin
        body: { name: Keyboard }
        expect: { status: 200 }
      - GET: /api/courses
        auth: admin
        expect:
          status: 200
          body: { $unordered: [ { name: Violin }, { name: Keyboard } ] }
