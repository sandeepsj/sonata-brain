area: Payments and discounts - behaviour kept from before the redesign
suite: baseline
# These rules existed before the fee redesign and still hold. The cases were ported to the new request shape
# (paymentType + periodDate instead of termId) when the old shape was retired.
background:
  - use: root
  - set: { admin: "{{root}}" }
  - use: enrolment      # Violin quarterly last year (1000/1000/1200/1200), Asha enrolled 10 Jan - 20 Dec last year
  - POST: /api/students
    auth: admin
    body: { studentName: Ravi }      # Ravi: a student with no session at all
    expect: { status: 201 }
    save: { ravi: body.admissionNo }

cases:
  # ---------- additional payments ----------

  - id: PAY-010
    title: An additional payment has a label; its course is optional but must exist if given
    req: [REQ-061.AC1]
    steps:
      - POST: /api/payments
        auth: admin
        body: { studentId: "{{ravi}}", paymentType: ADDITIONAL, amountPaid: 500, label: Admission fee }
        expect: { status: 201, body: { paymentType: ADDITIONAL, label: Admission fee, courseName: null } }
      - POST: /api/payments
        auth: admin
        body: { studentId: "{{asha}}", paymentType: ADDITIONAL, amountPaid: 250, label: Exam fee, courseName: Violin }
        expect: { status: 201, body: { paymentType: ADDITIONAL, courseName: Violin } }
      - POST: /api/payments
        auth: admin
        body: { studentId: "{{asha}}", paymentType: ADDITIONAL, amountPaid: 250, label: Exam fee, courseName: Cello }
        expect: { status: 400 }

  - id: PAY-011
    title: An additional payment needs a label
    req: [REQ-061.AC2]
    examples:
      - { label: null }
      - { label: "  " }
    steps:
      - POST: /api/payments
        auth: admin
        body: { studentId: "{{ravi}}", paymentType: ADDITIONAL, amountPaid: 500, label: "{{label}}" }
        expect: { status: 400 }

  # ---------- amounts ----------

  - id: PAY-020
    title: A zero-amount payment is allowed only together with a discount
    req: [REQ-062.AC1]
    steps:
      - POST: /api/payments
        auth: admin
        body: { studentId: "{{ravi}}", paymentType: ADDITIONAL, amountPaid: 0, label: Waiver }
        expect: { status: 400, body: { message: { $contains: zero amount } } }
      - POST: /api/payments
        auth: admin
        body: { studentId: "{{ravi}}", paymentType: ADDITIONAL, amountPaid: 0, label: Waiver,
                discounts: [ { discountAmount: 500, label: Scholarship } ] }
        expect: { status: 201, body: { amountPaid: 0, discountAmount: 500 } }

  - id: PAY-021
    title: Negative or missing amount, or missing student, is rejected and nothing is stored
    req: [REQ-062.AC2]
    examples:
      - { body: { studentId: 1, paymentType: ADDITIONAL, amountPaid: -1, label: x } }
      - { body: { studentId: 1, paymentType: ADDITIONAL, label: x } }
      - { body: { paymentType: ADDITIONAL, amountPaid: 100, label: x } }
    steps:
      - POST: /api/payments
        auth: admin
        body: "{{body}}"
        expect: { status: 400 }
      - GET: /api/payments
        auth: admin
        expect: { status: 200, body: [] }

  # ---------- discounts ----------

  - id: PAY-030
    title: Discounts are stored with the payment and their sum becomes the payment's discountAmount
    req: [REQ-063.AC1]
    steps:
      - POST: /api/payments
        auth: admin
        body:
          studentId: "{{asha}}"
          paymentType: REGULAR
          courseName: Violin
          periodDate: "{{year -1}}-08-01"
          amountPaid: 800
          label: Course fee
          discounts:
            - { discountAmount: 100, label: Sibling, remarks: second child }
            - { discountAmount: 50, label: Early bird }
        expect:
          status: 201
          body: { amountPaid: 800, discountAmount: 150 }
        save: { pid: body.id }
      - GET: /api/discounts/payment/{{pid}}
        auth: admin
        expect:
          status: 200
          body:
            $unordered:
              - { discountAmount: 100, label: Sibling, remarks: second child }
              - { discountAmount: 50, label: Early bird }

  - id: PAY-032
    title: Discounts can be read by payment and by id; unknown id gives 404
    req: [REQ-063.AC3]
    steps:
      - POST: /api/payments
        auth: admin
        body: { studentId: "{{ravi}}", paymentType: ADDITIONAL, amountPaid: 100, label: Books,
                discounts: [ { discountAmount: 20, label: Staff } ] }
        expect: { status: 201 }
        save: { pid: body.id }
      - GET: /api/discounts/payment/{{pid}}
        auth: admin
        expect: { status: 200, body: [ { label: Staff } ] }
        save: { did: body.0.id }
      - GET: /api/discounts/{{did}}
        auth: admin
        expect: { status: 200, body: { id: "{{did}}", discountAmount: 20, label: Staff } }
      - GET: /api/discounts/999999
        auth: admin
        expect: { status: 404 }

  # ---------- deactivation ----------

  - id: PAY-040
    title: A payment can be deactivated
    req: [REQ-064.AC1]
    steps:
      - POST: /api/payments
        auth: admin
        body: { studentId: "{{ravi}}", paymentType: ADDITIONAL, amountPaid: 100, label: Books }
        expect: { status: 201 }
        save: { pid: body.id }
      - PATCH: /api/payments/{{pid}}/deactivate
        auth: admin
        expect: { status: 200, body: { id: "{{pid}}", isActive: false } }
      - GET: /api/payments/{{pid}}
        auth: admin
        expect: { status: 200, body: { isActive: false } }

  - id: PAY-041
    title: Deactivating twice is a conflict; an unknown payment gives 404
    req: [REQ-064.AC2]
    steps:
      - POST: /api/payments
        auth: admin
        body: { studentId: "{{ravi}}", paymentType: ADDITIONAL, amountPaid: 100, label: Books }
        expect: { status: 201 }
        save: { pid: body.id }
      - PATCH: /api/payments/{{pid}}/deactivate
        auth: admin
        expect: { status: 200 }
      - PATCH: /api/payments/{{pid}}/deactivate
        auth: admin
        expect: { status: 409, body: { message: { $contains: already deactivated } } }
      - PATCH: /api/payments/999999/deactivate
        auth: admin
        expect: { status: 404 }

  - id: PAY-042
    title: There is no way to reactivate a payment
    req: [REQ-064.AC3]
    steps:
      - POST: /api/payments
        auth: admin
        body: { studentId: "{{ravi}}", paymentType: ADDITIONAL, amountPaid: 100, label: Books }
        expect: { status: 201 }
        save: { pid: body.id }
      - PATCH: /api/payments/{{pid}}/deactivate
        auth: admin
        expect: { status: 200 }
      - PATCH: /api/payments/{{pid}}/activate
        auth: admin
        expect: { status: { $gte: 400 } }
      - PUT: /api/payments/{{pid}}
        auth: admin
        body: { isActive: true }
        expect: { status: { $gte: 400 } }
      - GET: /api/payments/{{pid}}
        auth: admin
        expect: { status: 200, body: { isActive: false } }
