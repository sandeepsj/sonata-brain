area: Dues - how they are generated and queried (today)
suite: baseline
background:
  - use: baseline-admin
  - use: legacy-enrolment        # Violin, last year's terms t1..t4 (1000, 1000, 1200, 1200), Asha enrolled all year
  # Dues are created in the background; wait until Asha's 4 dues for last year exist.
  - GET: /api/dues/student/{{asha}}
    eventually: 10s
    auth: admin
    expect: { status: 200, body: { $len: 4 } }
    save:
      d1: body.0.id
      d2: body.1.id
      d3: body.2.id
      d4: body.3.id

cases:
  # ---------- generation ----------

  - id: DUE-L01
    title: Enrolling creates one DUE per term the session has covered, at the term amount, ordered by term
    req: [REQ-077.AC1, REQ-076.AC1]
    steps:
      - GET: /api/dues/student/{{asha}}
        auth: admin
        expect:
          status: 200
          body:
            - { termYear: "{{year -1}}", termNumber: 1, dueAmount: 1000, status: DUE, feeStructureId: "{{t1}}",
                courseName: Violin, studentId: "{{asha}}", studentName: Asha, sessionId: "{{sid}}" }
            - { termYear: "{{year -1}}", termNumber: 2, dueAmount: 1000, status: DUE, feeStructureId: "{{t2}}" }
            - { termYear: "{{year -1}}", termNumber: 3, dueAmount: 1200, status: DUE, feeStructureId: "{{t3}}" }
            - { termYear: "{{year -1}}", termNumber: 4, dueAmount: 1200, status: DUE, feeStructureId: "{{t4}}" }

  - id: DUE-L02
    title: Creating a fee structure bills ongoing students immediately, even for terms that haven't started
    req: [REQ-077.AC2]
    steps:
      - POST: /api/fee-structures
        auth: admin
        body:
          courseId: Violin
          year: "{{year +1}}"
          numberOfTerms: 2
          termFees: [ { term: 1, amount: 3000 }, { term: 2, amount: 3500 } ]
        expect: { status: 200 }
      - GET: /api/dues/student/{{asha}}
        eventually: 10s
        auth: admin
        expect:
          status: 200
          body:
            $len: 6
            $has:
              - { termYear: "{{year +1}}", termNumber: 1, dueAmount: 3000, status: DUE }
              - { termYear: "{{year +1}}", termNumber: 2, dueAmount: 3500, status: DUE }

  # ---------- payments ----------

  - id: DUE-L03
    title: A course-fee payment lowers the matching due - partly paid, then paid
    req: [REQ-077.AC3]
    steps:
      - POST: /api/payments
        auth: admin
        body: { studentId: "{{asha}}", termId: "{{t1}}", courseName: Violin, amountPaid: 400, label: Course fee }
        expect: { status: 201 }
      - GET: /api/dues/student/{{asha}}
        eventually: 10s
        auth: admin
        expect: { status: 200, body: { $has: [ { id: "{{d1}}", dueAmount: 600, status: PARTIALLY_PAID } ] } }
      - POST: /api/payments
        auth: admin
        body:
          studentId: "{{asha}}"
          termId: "{{t1}}"
          label: Course fee
          courseName: Violin
          amountPaid: 500
          discounts: [ { discountAmount: 100, label: Sibling } ]
        expect: { status: 201 }
      - GET: /api/dues/student/{{asha}}
        eventually: 10s
        auth: admin
        expect: { status: 200, body: { $has: [ { id: "{{d1}}", dueAmount: 0, status: PAID } ] } }

  - id: DUE-L04
    title: Deactivating a payment puts amount and discount back on the due
    req: [REQ-077.AC4, REQ-064.AC6]
    suite: quarantine   # flaky until REQ-064.AC6 (deactivation race) is fixed
    steps:
      - POST: /api/payments
        auth: admin
        body:
          studentId: "{{asha}}"
          termId: "{{t3}}"
          label: Course fee
          courseName: Violin
          amountPaid: 300
          discounts: [ { discountAmount: 200, label: Sibling } ]
        expect: { status: 201 }
        save: { pid: body.id }
      - GET: /api/dues/student/{{asha}}
        eventually: 10s
        auth: admin
        expect: { status: 200, body: { $has: [ { id: "{{d3}}", dueAmount: 700, status: PARTIALLY_PAID } ] } }
      - PATCH: /api/payments/{{pid}}/deactivate
        auth: admin
        expect: { status: 200 }
      - GET: /api/dues/student/{{asha}}
        eventually: 10s
        auth: admin
        expect: { status: 200, body: { $has: [ { id: "{{d3}}", dueAmount: 1200, status: DUE } ] } }

  # ---------- disjoin and waiver ----------

  - id: DUE-L05
    title: Disjoining cancels dues of terms that start later; past terms stay due
    req: [REQ-077.AC5]
    steps:
      - POST: /api/fee-structures
        auth: admin
        body:
          courseId: Violin
          year: "{{year +1}}"
          numberOfTerms: 2
          termFees: [ { term: 1, amount: 3000 }, { term: 2, amount: 3500 } ]
        expect: { status: 200 }
      - GET: /api/dues/student/{{asha}}
        eventually: 10s
        auth: admin
        expect: { status: 200, body: { $len: 6 } }
      - PATCH: /api/student-sessions/{{sid}}/disjoin
        auth: admin
        expect: { status: 200 }
      - GET: /api/dues/student/{{asha}}
        eventually: 10s
        auth: admin
        expect:
          status: 200
          body:
            $has:
              - { termYear: "{{year +1}}", termNumber: 1, status: CANCELLED }
              - { termYear: "{{year +1}}", termNumber: 2, status: CANCELLED }
            $none: { termYear: "{{year -1}}", status: CANCELLED }

  - id: DUE-L06
    title: A due can be marked "student left" only after the student has left, and only while unpaid
    req: [REQ-072.AC1]
    steps:
      - POST: /api/payments
        auth: admin
        body: { studentId: "{{asha}}", termId: "{{t1}}", courseName: Violin, amountPaid: 1000, label: Course fee }
        expect: { status: 201 }
      - GET: /api/dues/student/{{asha}}
        eventually: 10s
        auth: admin
        expect: { status: 200, body: { $has: [ { id: "{{d1}}", status: PAID } ] } }
      - PATCH: /api/dues/{{d4}}/mark-student-left-cancelled
        auth: admin
        expect: { status: 400, body: { message: { $contains: does not have any disjoined session } } }
      - PATCH: /api/student-sessions/{{sid}}/disjoin
        auth: admin
        expect: { status: 200 }
      - PATCH: /api/dues/{{d4}}/mark-student-left-cancelled
        auth: admin
        expect: { status: 200, body: { id: "{{d4}}", status: STUDENT_LEFT_DUE_CANCELLED } }
      - PATCH: /api/dues/{{d1}}/mark-student-left-cancelled
        auth: admin
        expect: { status: 400, body: { message: { $contains: "Current status: PAID" } } }

  # ---------- summaries and filters ----------

  - id: DUE-L10
    title: The student summary counts and totals dues per status
    req: [REQ-076.AC2]
    steps:
      - POST: /api/payments
        auth: admin
        body: { studentId: "{{asha}}", termId: "{{t1}}", courseName: Violin, amountPaid: 1000, label: Course fee }
        expect: { status: 201 }
      - POST: /api/payments
        auth: admin
        body: { studentId: "{{asha}}", termId: "{{t2}}", courseName: Violin, amountPaid: 400, label: Course fee }
        expect: { status: 201 }
      - GET: /api/dues/summary/{{asha}}
        eventually: 10s
        auth: admin
        expect:
          status: 200
          body:
            studentId: "{{asha}}"
            studentName: Asha
            totalCount: 4
            paidCount: 1
            partiallyPaidCount: 1
            partiallyPaidAmount: 600
            dueCount: 2
            dueAmount: 2400
            totalDueAmount: 3000

  - id: DUE-L11
    title: Due lists and totals can be filtered by status, year, term and course; a bad status gives 400
    req: [REQ-076.AC3]
    steps:
      - POST: /api/payments
        auth: admin
        body: { studentId: "{{asha}}", termId: "{{t1}}", courseName: Violin, amountPaid: 1000, label: Course fee }
        expect: { status: 201 }
      - POST: /api/payments
        auth: admin
        body: { studentId: "{{asha}}", termId: "{{t2}}", courseName: Violin, amountPaid: 400, label: Course fee }
        expect: { status: 201 }
      - GET: /api/dues/summary/{{asha}}
        eventually: 10s
        auth: admin
        expect: { status: 200, body: { paidCount: 1, partiallyPaidCount: 1 } }
      - GET: /api/dues
        auth: admin
        query: { statuses: DUE }
        expect: { status: 200, body: { $len: 2, $every: { status: DUE } } }
      - GET: /api/dues
        auth: admin
        query: { statuses: "DUE,PAID", termNumber: 1 }
        expect: { status: 200, body: [ { termNumber: 1, status: PAID } ] }
      - GET: /api/dues
        auth: admin
        query: { statuses: bogus }
        expect: { status: 400 }
      - GET: /api/dues/pending
        auth: admin
        query: { course: Violin, year: "{{year -1}}" }
        expect: { status: 200, body: { $len: 3 } }
      - GET: /api/dues/aggregate
        auth: admin
        query: { statuses: "DUE,PARTIALLY_PAID" }
        expect: { status: 200, body: { count: 3, totalDue: 3000 } }
      - GET: /api/dues/aggregate/pending
        auth: admin
        expect: { status: 200, body: { count: 3, totalDue: 3000 } }
      - GET: /api/dues/aggregate/by-course
        auth: admin
        expect: { status: 200, body: [ { course: Violin, count: 4, totalDue: 3000 } ] }
