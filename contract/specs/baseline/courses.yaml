area: Courses (today)
suite: baseline
background:
  - use: baseline-admin

cases:
  - id: CRS-002
    title: All courses are listed
    req: [REQ-040.AC2]
    steps:
      - POST: /api/courses
        auth: admin
        body: { name: Violin }
        expect: { status: 201 }
      - POST: /api/courses
        auth: admin
        body: { name: Keyboard }
        expect: { status: 201 }
      - GET: /api/courses
        auth: admin
        expect:
          status: 200
          body: { $unordered: [ { name: Violin }, { name: Keyboard } ] }
