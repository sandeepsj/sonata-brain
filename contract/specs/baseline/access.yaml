area: Access - login, tokens, sign-up (today)
suite: baseline
background:
  - use: baseline-admin

cases:
  - id: ACC-001
    title: Health check answers OK without a token
    req: [REQ-007.AC1]
    steps:
      - GET: /heartbeat
        expect: { status: 200, text: OK }

  - id: ACC-002
    title: Login returns two different tokens
    req: [REQ-010.AC1]
    steps:
      - POST: /api/auth/login
        body: { email: root@sonata.test, password: root-password-1 }
        expect:
          status: 200
          body:
            accessToken: { $notBlank: true }
            refreshToken: { $notBlank: true, $ne: "{{admin}}" }

  - id: ACC-003
    title: Refresh issues a working access token and returns the same refresh token
    req: [REQ-010.AC2]
    steps:
      - POST: /api/auth/refresh
        auth: adminRefresh
        expect:
          status: 200
          body:
            accessToken: { $notBlank: true }
            refreshToken: "{{adminRefresh}}"
        save: { fresh: body.accessToken }
      - GET: /api/courses
        auth: fresh
        expect: { status: 200 }

  - id: ACC-004
    title: An administrator's token is accepted on protected endpoints
    req: [REQ-010.AC3]
    steps:
      - GET: /api/courses
        auth: admin
        expect: { status: 200 }
      - GET: /api/students
        auth: admin
        expect: { status: 200 }
      - GET: /api/payments
        auth: admin
        expect: { status: 200 }
