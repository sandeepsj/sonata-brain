area: Student sessions - enrolment in a course (today)
suite: baseline
background:
  - use: baseline-admin
  # Every case starts with two courses and two students:
  #   Violin, Keyboard;  Asha = {{asha}}, Ravi = {{ravi}}
  - POST: /api/courses
    auth: admin
    body: { name: Violin }
    expect: { status: 200 }
  - POST: /api/courses
    auth: admin
    body: { name: Keyboard }
    expect: { status: 200 }
  - POST: /api/students
    auth: admin
    body: { studentName: Asha }
    expect: { status: 200 }
    save: { asha: body.admissionNo }
  - POST: /api/students
    auth: admin
    body: { studentName: Ravi }
    expect: { status: 200 }
    save: { ravi: body.admissionNo }

cases:
  # ---------- create ----------

  - id: SES-001
    title: A session is created with the given dates and returns the student and course
    req: [REQ-030.AC1]
    steps:
      - POST: /api/student-sessions
        auth: admin
        body:
          studentId: "{{asha}}"
          courseName: Violin
          dateOfJoining: "{{today -60d}}T10:00:00"
        expect:
          status: 200
          body:
            id: { $type: integer }
            student: { admissionNo: "{{asha}}", studentName: Asha }
            course: { name: Violin }
            dateOfJoining: "{{today -60d}}T10:00:00"
            dateOfDisjoining: null

  - id: SES-002
    title: A missing joining date defaults to now
    req: [REQ-030.AC1]
    steps:
      - POST: /api/student-sessions
        auth: admin
        body: { studentId: "{{asha}}", courseName: Violin }
        expect:
          status: 200
          body: { dateOfJoining: { $regex: "^{{today}}T" } }

  - id: SES-003
    title: An unknown student or course gives 404
    req: [REQ-030.AC2]
    steps:
      - POST: /api/student-sessions
        auth: admin
        body: { studentId: 999999, courseName: Violin }
        expect: { status: 404 }
      - POST: /api/student-sessions
        auth: admin
        body: { studentId: "{{asha}}", courseName: Cello }
        expect: { status: 404 }

  - id: SES-004
    title: Joining or disjoining dates in the future are rejected
    req: [REQ-030.AC3]
    steps:
      - POST: /api/student-sessions
        auth: admin
        body: { studentId: "{{asha}}", courseName: Violin, dateOfJoining: "{{today +1d}}T10:00:00" }
        expect: { status: 400 }
      - POST: /api/student-sessions
        auth: admin
        body:
          studentId: "{{asha}}"
          courseName: Violin
          dateOfJoining: "{{today -10d}}T10:00:00"
          dateOfDisjoining: "{{today +1d}}T10:00:00"
        expect: { status: 400 }
      - GET: /api/student-sessions/all
        auth: admin
        expect: { status: 200, body: [] }

  - id: SES-005
    title: A disjoining date before the joining date is rejected
    req: [REQ-030.AC4]
    steps:
      - POST: /api/student-sessions
        auth: admin
        body:
          studentId: "{{asha}}"
          courseName: Violin
          dateOfJoining: "{{today -10d}}T10:00:00"
          dateOfDisjoining: "{{today -20d}}T10:00:00"
        expect: { status: 400 }

  - id: SES-006
    title: A second session overlapping an ongoing one in the same course is rejected, naming the conflict
    req: [REQ-030.AC5]
    steps:
      - POST: /api/student-sessions
        auth: admin
        body: { studentId: "{{asha}}", courseName: Violin, dateOfJoining: "{{today -100d}}T10:00:00" }
        expect: { status: 200 }
        save: { first: body.id }
      - POST: /api/student-sessions
        auth: admin
        body: { studentId: "{{asha}}", courseName: Violin, dateOfJoining: "{{today -5d}}T10:00:00" }
        expect:
          status: 400
          body: { message: { $contains: "ID: {{first}}" } }

  - id: SES-007
    title: A past session that overlaps a closed session in the same course is rejected
    req: [REQ-030.AC5]
    steps:
      - POST: /api/student-sessions
        auth: admin
        body:
          studentId: "{{asha}}"
          courseName: Violin
          dateOfJoining: "{{today -100d}}T10:00:00"
          dateOfDisjoining: "{{today -50d}}T10:00:00"
        expect: { status: 200 }
      - POST: /api/student-sessions
        auth: admin
        body:
          studentId: "{{asha}}"
          courseName: Violin
          dateOfJoining: "{{today -60d}}T10:00:00"
          dateOfDisjoining: "{{today -40d}}T10:00:00"
        expect: { status: 400 }

  - id: SES-008
    title: Non-overlapping sessions in the same course, and parallel sessions in different courses, are allowed
    req: [REQ-030.AC5]
    steps:
      - POST: /api/student-sessions
        auth: admin
        body:
          studentId: "{{asha}}"
          courseName: Violin
          dateOfJoining: "{{today -100d}}T10:00:00"
          dateOfDisjoining: "{{today -50d}}T10:00:00"
        expect: { status: 200 }
      - POST: /api/student-sessions
        auth: admin
        body: { studentId: "{{asha}}", courseName: Violin, dateOfJoining: "{{today -40d}}T10:00:00" }
        expect: { status: 200 }
      - POST: /api/student-sessions
        auth: admin
        body: { studentId: "{{asha}}", courseName: Keyboard, dateOfJoining: "{{today -40d}}T10:00:00" }
        expect: { status: 200 }
      - POST: /api/student-sessions
        auth: admin
        body: { studentId: "{{ravi}}", courseName: Violin, dateOfJoining: "{{today -40d}}T10:00:00" }
        expect: { status: 200 }

  - id: SES-009
    title: studentId and courseName are required
    req: [REQ-030.AC6]
    steps:
      - POST: /api/student-sessions
        auth: admin
        body: { courseName: Violin }
        expect: { status: 400 }
      - POST: /api/student-sessions
        auth: admin
        body: { studentId: "{{asha}}" }
        expect: { status: 400 }

  # ---------- disjoin ----------

  - id: SES-010
    title: Disjoining sets the disjoining date to now
    req: [REQ-031.AC1]
    steps:
      - POST: /api/student-sessions
        auth: admin
        body: { studentId: "{{asha}}", courseName: Violin, dateOfJoining: "{{today -30d}}T10:00:00" }
        expect: { status: 200 }
        save: { sid: body.id }
      - PATCH: /api/student-sessions/{{sid}}/disjoin
        auth: admin
        expect:
          status: 200
          body: { id: "{{sid}}", dateOfDisjoining: { $regex: "^{{today}}T" } }

  - id: SES-011
    title: Disjoining twice is rejected; an unknown session gives 404
    req: [REQ-031.AC2]
    steps:
      - POST: /api/student-sessions
        auth: admin
        body: { studentId: "{{asha}}", courseName: Violin, dateOfJoining: "{{today -30d}}T10:00:00" }
        expect: { status: 200 }
        save: { sid: body.id }
      - PATCH: /api/student-sessions/{{sid}}/disjoin
        auth: admin
        expect: { status: 200 }
      - PATCH: /api/student-sessions/{{sid}}/disjoin
        auth: admin
        expect: { status: 400 }
      - PATCH: /api/student-sessions/999999/disjoin
        auth: admin
        expect: { status: 404 }

  # ---------- queries ----------

  - id: SES-020
    title: A session can be fetched by id; unknown id gives 404
    req: [REQ-032.AC1]
    steps:
      - POST: /api/student-sessions
        auth: admin
        body: { studentId: "{{asha}}", courseName: Violin, dateOfJoining: "{{today -30d}}T10:00:00" }
        expect: { status: 200 }
        save: { sid: body.id }
      - GET: /api/student-sessions/{{sid}}
        auth: admin
        expect: { status: 200, body: { id: "{{sid}}", course: { name: Violin } } }
      - GET: /api/student-sessions/999999
        auth: admin
        expect: { status: 404 }

  - id: SES-021
    title: The /all endpoint filters by student, course and active flag in any combination
    req: [REQ-032.AC2]
    steps:
      # Asha: Violin closed, Violin ongoing, Keyboard ongoing.  Ravi: Violin ongoing.
      - POST: /api/student-sessions
        auth: admin
        body:
          studentId: "{{asha}}"
          courseName: Violin
          dateOfJoining: "{{today -100d}}T10:00:00"
          dateOfDisjoining: "{{today -50d}}T10:00:00"
        expect: { status: 200 }
        save: { ashaViolinOld: body.id }
      - POST: /api/student-sessions
        auth: admin
        body: { studentId: "{{asha}}", courseName: Violin, dateOfJoining: "{{today -40d}}T10:00:00" }
        expect: { status: 200 }
        save: { ashaViolin: body.id }
      - POST: /api/student-sessions
        auth: admin
        body: { studentId: "{{asha}}", courseName: Keyboard, dateOfJoining: "{{today -40d}}T10:00:00" }
        expect: { status: 200 }
        save: { ashaKeys: body.id }
      - POST: /api/student-sessions
        auth: admin
        body: { studentId: "{{ravi}}", courseName: Violin, dateOfJoining: "{{today -40d}}T10:00:00" }
        expect: { status: 200 }
        save: { raviViolin: body.id }

      - GET: /api/student-sessions/all
        auth: admin
        expect: { status: 200, body: { $len: 4 } }
      - GET: /api/student-sessions/all
        auth: admin
        query: { active: false }
        expect: { status: 200, body: [ { id: "{{ashaViolinOld}}" } ] }
      - GET: /api/student-sessions/all
        auth: admin
        query: { studentId: "{{asha}}" }
        expect: { status: 200, body: { $len: 3 } }
      - GET: /api/student-sessions/all
        auth: admin
        query: { studentId: "{{asha}}", active: true }
        expect: { status: 200, body: { $unordered: [ { id: "{{ashaViolin}}" }, { id: "{{ashaKeys}}" } ] } }
      - GET: /api/student-sessions/all
        auth: admin
        query: { courseName: Violin, active: true }
        expect: { status: 200, body: { $unordered: [ { id: "{{ashaViolin}}" }, { id: "{{raviViolin}}" } ] } }
      - GET: /api/student-sessions/all
        auth: admin
        query: { studentId: "{{asha}}", courseName: Violin }
        expect: { status: 200, body: { $len: 2 } }
      - GET: /api/student-sessions/all
        auth: admin
        query: { studentId: "{{asha}}", courseName: Violin, active: false }
        expect: { status: 200, body: [ { id: "{{ashaViolinOld}}" } ] }

  - id: SES-022
    title: The /all endpoint gives 404 for an unknown student or course
    req: [REQ-032.AC2]
    steps:
      - GET: /api/student-sessions/all
        auth: admin
        query: { studentId: 999999 }
        expect: { status: 404 }
      - GET: /api/student-sessions/all
        auth: admin
        query: { courseName: Cello }
        expect: { status: 404 }

  - id: SES-023
    title: Per-student session lists give 404 when the student has no matching sessions
    req: [REQ-032.AC3]
    steps:
      - GET: /api/student-sessions/active/student/{{asha}}
        auth: admin
        expect: { status: 404 }
      - GET: /api/student-sessions/all/student/{{asha}}
        auth: admin
        expect: { status: 404 }
      - POST: /api/student-sessions
        auth: admin
        body:
          studentId: "{{asha}}"
          courseName: Violin
          dateOfJoining: "{{today -100d}}T10:00:00"
          dateOfDisjoining: "{{today -50d}}T10:00:00"
        expect: { status: 200 }
      - GET: /api/student-sessions/active/student/{{asha}}
        auth: admin
        expect: { status: 404 }
      - GET: /api/student-sessions/all/student/{{asha}}
        auth: admin
        expect: { status: 200, body: { $len: 1 } }

  - id: SES-024
    title: Per-course session lists give 404 when the course has no matching sessions
    req: [REQ-032.AC4]
    steps:
      - GET: /api/student-sessions/active/course/Violin
        auth: admin
        expect: { status: 404 }
      - GET: /api/student-sessions/all/course/Violin
        auth: admin
        expect: { status: 404 }
      - POST: /api/student-sessions
        auth: admin
        body: { studentId: "{{asha}}", courseName: Violin, dateOfJoining: "{{today -10d}}T10:00:00" }
        expect: { status: 200 }
      - GET: /api/student-sessions/active/course/Violin
        auth: admin
        expect: { status: 200, body: [ { student: { studentName: Asha } } ] }
      - GET: /api/student-sessions/all/course/Violin
        auth: admin
        expect: { status: 200, body: { $len: 1 } }

  - id: SES-025
    title: Session search needs at least one filter
    req: [REQ-032.AC5]
    steps:
      - GET: /api/student-sessions/search
        auth: admin
        expect: { status: 400 }
