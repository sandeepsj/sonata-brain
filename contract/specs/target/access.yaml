area: Access - login, roles, per-route read and write (new contract)
suite: target
background:
  - use: root

cases:
  # ---------- login ----------

  - id: ACC-T01
    title: Login returns tokens and the user's effective routes
    req: [REQ-010.AC9, REQ-015.AC1, REQ-013.AC5]
    steps:
      - POST: /api/auth/login
        body: { email: root@sonata.test, password: root-password-1 }
        expect:
          status: 200
          body:
            accessToken: { $notBlank: true }
            refreshToken: { $notBlank: true }
            routes:
              $len: 10
              $every: { read: true, write: true }
              $has:
                - { path: /api/students/** }
                - { path: /api/roles/** }
      - use: staff
        with:
          as: reader
          routes:
            - { path: /api/students/**, read: true, write: false }
            - { path: /api/payments/**, read: true, write: true }
            - { path: /api/courses/**, read: false, write: false }
      - GET: /api/users/me
        auth: reader
        expect:
          status: 200
          body:
            routes:
              $unordered:
                - { path: /api/students/**, read: true, write: false }
                - { path: /api/payments/**, read: true, write: true }

  - id: ACC-T02
    title: Wrong password and unknown email both give 401 with the same message
    req: [REQ-010.AC6]
    steps:
      - POST: /api/auth/login
        body: { email: root@sonata.test, password: wrong-password }
        expect: { status: 401, body: { $shape: error, status: 401 } }
        save: { message: body.message }
      - POST: /api/auth/login
        body: { email: "nobody-{{uniq}}@sonata.test", password: wrong-password }
        expect: { status: 401, body: { $shape: error, message: "{{message}}" } }

  - id: ACC-T03
    title: A protected endpoint without a token, or with a broken token, gives 401
    req: [REQ-010.AC7]
    steps:
      - GET: /api/students
        expect: { status: 401, body: { $shape: error, status: 401 } }
      - GET: /api/students
        headers: { Authorization: Bearer not-a-real-token }
        expect: { status: 401, body: { $shape: error } }
      - GET: /api/students
        headers: { Authorization: Basic cm9vdDpwdw== }
        expect: { status: 401 }

  - id: ACC-T04
    title: Refresh accepts only a refresh token, and returns the routes again
    req: [REQ-010.AC8, REQ-010.AC9]
    steps:
      - POST: /api/auth/refresh
        auth: root
        expect: { status: 401, body: { $shape: error } }
      - POST: /api/auth/refresh
        headers: { Authorization: Bearer garbage }
        expect: { status: 401 }
      - POST: /api/auth/refresh
        auth: rootRefresh
        expect:
          status: 200
          body: { accessToken: { $notBlank: true }, refreshToken: "{{rootRefresh}}", routes: { $len: 10 } }
      - GET: /api/students
        auth: rootRefresh
        expect: { status: 401 }

  # ---------- access per route ----------

  - id: ACC-T05
    title: "For every route: read-only can GET but not write; neither flag gets 403 on both"
    req: [REQ-011.AC6, REQ-011.AC8]
    examples:
      - { route: /api/students/**,         read: /api/students,                    write: /api/students,         other: /api/courses/**, readStatus: 200 }
      - { route: /api/student-sessions/**, read: /api/student-sessions/all,        write: /api/student-sessions, other: /api/courses/**, readStatus: 200 }
      - { route: /api/courses/**,          read: /api/courses,                     write: /api/courses,          other: /api/students/**, readStatus: 200 }
      - { route: /api/fee-structures/**,   read: /api/fee-structures/by-year/2026, write: /api/fee-structures,   other: /api/courses/**, readStatus: 400 }
      - { route: /api/payments/**,         read: /api/payments,                    write: /api/payments,         other: /api/courses/**, readStatus: 200 }
      - { route: /api/discounts/**,        read: /api/discounts,                   write: /api/discounts,        other: /api/courses/**, readStatus: 200 }
      - { route: /api/dues/**,             read: /api/dues,                        write: /api/dues,             other: /api/courses/**, readStatus: 200 }
      - { route: /api/users/**,            read: /api/users,                       write: /api/users/1/roles,    other: /api/courses/**, readStatus: 200 }
      - { route: /api/roles/**,            read: /api/roles,                       write: /api/roles,            other: /api/courses/**, readStatus: 200 }
      - { route: /api/logging/**,          read: /api/logging/strategy,            write: /api/logging/test,     other: /api/courses/**, readStatus: 200 }
    # readStatus: what an allowed GET returns on an empty database (200 unless noted; the legacy fee-structure
    # lookup answers 400 "No fee structures found" when there are none). Anything but 403 proves access.
    steps:
      - use: staff
        with: { as: reader, routes: [ { path: "{{route}}", read: true, write: false } ] }
      - use: staff
        with: { as: outsider, routes: [ { path: "{{other}}", read: true, write: true } ] }
      - GET: "{{read}}"
        auth: reader
        expect: { status: "{{readStatus}}" }
      - POST: "{{write}}"
        auth: reader
        body: {}
        expect: { status: 403, body: { $shape: error, status: 403 } }
      - GET: "{{read}}"
        auth: outsider
        expect: { status: 403 }
      - POST: "{{write}}"
        auth: outsider
        body: {}
        expect: { status: 403 }

  - id: ACC-T06
    title: Read and write are independent - write-only can write but not read
    req: [REQ-011.AC7]
    steps:
      - use: staff
        with: { as: writer, routes: [ { path: /api/students/**, read: false, write: true } ] }
      - POST: /api/students
        auth: writer
        body: { studentName: Asha }
        expect: { status: 200 }
      - GET: /api/students
        auth: writer
        expect: { status: 403, body: { $shape: error } }

  - id: ACC-T07
    title: A forbidden write changes nothing
    req: [REQ-011.AC3]
    steps:
      - use: staff
        with: { as: reader, routes: [ { path: /api/students/**, read: true, write: false } ] }
      - POST: /api/students
        auth: reader
        body: { studentName: Sneaky }
        expect: { status: 403, body: { $shape: error } }
      - GET: /api/students
        auth: root
        expect: { status: 200, body: { totalElements: 0 } }

  - id: ACC-T08
    title: A role change reaches the user at their next refresh, not before
    req: [REQ-011.AC9, REQ-012.AC9, REQ-013.AC5]
    steps:
      - use: staff
        with: { as: clerk, routes: [ { path: /api/students/**, read: true, write: false } ] }
      - PUT: /api/roles/{{clerkRoleId}}
        auth: root
        body: { name: "clerk-{{uniq}}", description: upgraded,
                routes: [ { path: /api/students/**, read: true, write: true } ] }
        expect:
          status: 200
          body:
            routes:
              $has:
                - { path: /api/students/**, read: true, write: true }
                - { path: /api/payments/**, read: false, write: false }
      - POST: /api/students
        auth: clerk
        body: { studentName: Before }
        expect: { status: 403 }
      - GET: /api/users/me
        auth: clerk
        expect:
          status: 200
          body: { routes: [ { path: /api/students/**, read: true, write: true } ] }
      - POST: /api/auth/refresh
        auth: clerkRefresh
        expect: { status: 200, body: { routes: [ { path: /api/students/**, read: true, write: true } ] } }
        save: { clerk: body.accessToken }
      - POST: /api/students
        auth: clerk
        body: { studentName: After }
        expect: { status: 200 }
      - PUT: /api/roles/{{clerkRoleId}}
        auth: root
        body: { name: "clerk-{{uniq}}", description: downgraded, routes: [] }
        expect: { status: 200 }
      - POST: /api/auth/refresh
        auth: clerkRefresh
        expect: { status: 200, body: { routes: [] } }
        save: { clerk: body.accessToken }
      - GET: /api/students
        auth: clerk
        expect: { status: 403 }

  - id: ACC-T09
    title: "A teacher-style role: read on every route, write on none"
    req: [REQ-011.AC6, REQ-012.AC7]
    steps:
      - use: staff
        with:
          as: teacher
          routes:
            - { path: /api/students/**, read: true, write: false }
            - { path: /api/student-sessions/**, read: true, write: false }
            - { path: /api/courses/**, read: true, write: false }
            - { path: /api/fee-structures/**, read: true, write: false }
            - { path: /api/payments/**, read: true, write: false }
            - { path: /api/discounts/**, read: true, write: false }
            - { path: /api/dues/**, read: true, write: false }
      - GET: /api/students
        auth: teacher
        expect: { status: 200 }
      - GET: /api/dues
        auth: teacher
        expect: { status: 200 }
      - GET: /api/payments
        auth: teacher
        expect: { status: 200 }
      - POST: /api/students
        auth: teacher
        body: { studentName: Nope }
        expect: { status: 403 }
      - POST: /api/courses
        auth: teacher
        body: { name: Nope }
        expect: { status: 403 }
      - PATCH: /api/payments/1/deactivate
        auth: teacher
        expect: { status: 403 }
      - GET: /api/users
        auth: teacher
        expect: { status: 403 }

  # ---------- roles ----------

  - id: ACC-T10
    title: A role is created with its routes; every catalogue path is listed, false where not granted
    req: [REQ-012.AC7, REQ-012.AC8]
    steps:
      - POST: /api/roles
        auth: root
        body:
          name: "Accountant {{uniq}}"
          description: Takes payments, reads students
          routes:
            - { path: /api/payments/**, read: true, write: true }
            - { path: /api/students/**, read: true, write: false }
            - { path: /api/dues/**, read: true, write: false }
        expect:
          status: 201
          body:
            id: { $type: integer }
            name: { $regex: "^Accountant u" }
            description: Takes payments, reads students
            builtIn: false
            routes:
              - { path: /api/students/**, read: true, write: false }
              - { path: /api/student-sessions/**, read: false, write: false }
              - { path: /api/courses/**, read: false, write: false }
              - { path: /api/fee-structures/**, read: false, write: false }
              - { path: /api/payments/**, read: true, write: true }
              - { path: /api/discounts/**, read: false, write: false }
              - { path: /api/dues/**, read: true, write: false }
              - { path: /api/users/**, read: false, write: false }
              - { path: /api/roles/**, read: false, write: false }
              - { path: /api/logging/**, read: false, write: false }
        save: { rid: body.id, rname: body.name }
      - GET: /api/roles/{{rid}}
        auth: root
        expect:
          status: 200
          body: { id: "{{rid}}", name: "{{rname}}", routes: { $has: [ { path: /api/payments/**, write: true } ] } }
      - GET: /api/roles
        auth: root
        query: { name: "{{rname}}" }
        expect: { status: 200, body: [ { id: "{{rid}}" } ] }
      - GET: /api/roles
        auth: root
        expect: { status: 200, body: { $has: [ { id: "{{rid}}" }, { name: ADMIN } ] } }
      - GET: /api/roles/999999
        auth: root
        expect: { status: 404, body: { $shape: error } }

  - id: ACC-T11
    title: Role names are unique; unknown or repeated paths and blank names are rejected
    req: [REQ-012.AC7]
    steps:
      - POST: /api/roles
        auth: root
        body: { name: "Front desk {{uniq}}", routes: [ { path: /api/students/**, read: true, write: true } ] }
        expect: { status: 201 }
        save: { name: body.name }
      - POST: /api/roles
        auth: root
        body: { name: "{{name}}", routes: [] }
        expect: { status: 409, body: { $shape: error } }
      - POST: /api/roles
        auth: root
        body: { name: "Bad path {{uniq}}", routes: [ { path: /api/spaceships/**, read: true, write: false } ] }
        expect: { status: 400, body: { $shape: error } }
      - POST: /api/roles
        auth: root
        body: { name: "Bad path {{uniq}}", routes: [ { path: /api/students, read: true, write: false } ] }
        expect: { status: 400, body: { $shape: error } }
      - POST: /api/roles
        auth: root
        body:
          name: "Twice {{uniq}}"
          routes:
            - { path: /api/students/**, read: true, write: false }
            - { path: /api/students/**, read: false, write: true }
        expect: { status: 400, body: { $shape: error } }
      - POST: /api/roles
        auth: root
        body: { name: "  ", routes: [] }
        expect: { status: 400, body: { $shape: error } }

  - id: ACC-T12
    title: Deleting a role removes it from its users; the built-in ADMIN role can't be deleted
    req: [REQ-012.AC4, REQ-011.AC9]
    steps:
      - use: staff
        with: { as: temp, routes: [ { path: /api/students/**, read: true, write: false } ] }
      - DELETE: /api/roles/{{tempRoleId}}
        auth: root
        expect: { status: 204 }
      - GET: /api/roles/{{tempRoleId}}
        auth: root
        expect: { status: 404 }
      - GET: /api/users/me
        auth: temp
        expect: { status: 200, body: { roles: [], routes: [] } }
      - POST: /api/auth/refresh
        auth: tempRefresh
        expect: { status: 200, body: { routes: [] } }
        save: { temp: body.accessToken }
      - GET: /api/students
        auth: temp
        expect: { status: 403 }
      - GET: /api/roles
        auth: root
        query: { name: ADMIN }
        expect: { status: 200, body: [ { name: ADMIN, builtIn: true } ] }
        save: { adminRole: body.0.id }
      - DELETE: /api/roles/{{adminRole}}
        auth: root
        expect: { status: 409, body: { $shape: error } }

  - id: ACC-T13
    title: A user with two roles gets, per path, read if any role reads and write if any role writes
    req: [REQ-012.AC10]
    steps:
      - use: staff
        with:
          as: dual
          routes:
            - { path: /api/students/**, read: true, write: false }
            - { path: /api/courses/**, read: true, write: false }
      - POST: /api/roles
        auth: root
        body:
          name: "Second {{uniq}}"
          routes:
            - { path: /api/students/**, read: false, write: true }
            - { path: /api/payments/**, read: true, write: false }
        expect: { status: 201 }
        save: { second: body.id }
      - PUT: /api/users/{{dualId}}/roles
        auth: root
        body: { roleIds: [ "{{dualRoleId}}", "{{second}}" ] }
        expect: { status: 200 }
      - POST: /api/auth/refresh
        auth: dualRefresh
        expect:
          status: 200
          body:
            routes:
              $unordered:
                - { path: /api/students/**, read: true, write: true }
                - { path: /api/courses/**, read: true, write: false }
                - { path: /api/payments/**, read: true, write: false }
        save: { dual: body.accessToken }
      - POST: /api/students
        auth: dual
        body: { studentName: Combined }
        expect: { status: 200 }

  - id: ACC-T14
    title: The built-in ADMIN role has read and write on every route
    req: [REQ-012.AC11]
    steps:
      - GET: /api/roles
        auth: root
        query: { name: ADMIN }
        expect:
          status: 200
          body:
            - name: ADMIN
              builtIn: true
              routes: { $len: 10, $every: { read: true, write: true } }

  # ---------- token contents ----------

  - id: ACC-T15
    title: The access token carries the email, its type and only the granted routes; the refresh token has no routes
    req: [REQ-016.AC1, REQ-016.AC2]
    steps:
      - use: staff
        with:
          as: teacher
          routes:
            - { path: /api/students/**, read: true, write: false }
            - { path: /api/payments/**, read: false, write: false }
      - value: "{{jwtPayload teacher}}"
        expect:
          sub: { $regex: "^teacher-u" }
          type: ACCESS
          iat: { $type: integer }
          exp: { $type: integer }
          routes: [ { path: /api/students/**, read: true, write: false } ]
      - value: "{{jwtPayload teacherRefresh}}"
        expect: { type: REFRESH, sub: { $regex: "^teacher-u" }, routes: { $absent: true } }

  # ---------- users ----------

  - id: ACC-T20
    title: The user list shows ids, emails and roles, never passwords
    req: [REQ-013.AC1]
    steps:
      - use: staff
        with: { as: listed, routes: [ { path: /api/students/**, read: true, write: false } ] }
      - GET: /api/users
        auth: root
        expect:
          status: 200
          body:
            $has:
              - { id: "{{listedId}}", email: { $regex: "^listed-" }, roles: [ { id: "{{listedRoleId}}" } ] }
              - { email: root@sonata.test, roles: { $has: [ { name: ADMIN } ] } }
            $every: { password: { $absent: true }, passwordHash: { $absent: true } }

  - id: ACC-T21
    title: Assigning roles validates the role ids and the user
    req: [REQ-013.AC2]
    steps:
      - use: staff
        with: { as: target, routes: [ { path: /api/students/**, read: true, write: false } ] }
      - PUT: /api/users/{{targetId}}/roles
        auth: root
        body: { roleIds: [ 999999 ] }
        expect: { status: 400, body: { $shape: error } }
      - PUT: /api/users/999999/roles
        auth: root
        body: { roleIds: [ "{{targetRoleId}}" ] }
        expect: { status: 404, body: { $shape: error } }
      - PUT: /api/users/{{targetId}}/roles
        auth: root
        body: { roleIds: [] }
        expect: { status: 200, body: { roles: [] } }
      - POST: /api/auth/refresh
        auth: targetRefresh
        expect: { status: 200 }
        save: { target: body.accessToken }
      - GET: /api/students
        auth: target
        expect: { status: 403 }

  - id: ACC-T22
    title: Any logged-in user can read their own profile, even with no routes
    req: [REQ-013.AC5]
    steps:
      - POST: /api/users/signup
        body: { email: "fresh-{{uniq}}@sonata.test", password: fresh-password-1 }
        expect: { status: 201 }
        save: { email: body.email }
      - POST: /api/auth/login
        body: { email: "{{email}}", password: fresh-password-1 }
        expect: { status: 200 }
        save: { fresh: body.accessToken }
      - GET: /api/users/me
        auth: fresh
        expect:
          status: 200
          body: { email: "{{email}}", roles: [], routes: [], password: { $absent: true } }

  - id: ACC-T23
    title: The last administrator can't remove their own ADMIN role
    req: [REQ-013.AC4]
    steps:
      - GET: /api/users/me
        auth: root
        expect: { status: 200 }
        save: { rootId: body.id }
      - PUT: /api/users/{{rootId}}/roles
        auth: root
        body: { roleIds: [] }
        expect: { status: 409, body: { $shape: error } }
      - GET: /api/users/me
        auth: root
        expect: { status: 200, body: { roles: { $has: [ { name: ADMIN } ] } } }

  # ---------- sign-up ----------

  - id: ACC-T30
    title: Sign-up creates a user with no roles, who can log in but is forbidden everywhere
    req: [REQ-014.AC3]
    steps:
      - POST: /api/users/signup
        body: { email: "new-{{uniq}}@sonata.test", password: new-password-1 }
        expect:
          status: 201
          body: { id: { $type: integer }, roles: [], password: { $absent: true }, scope: { $absent: true } }
        save: { email: body.email }
      - POST: /api/auth/login
        body: { email: "{{email}}", password: new-password-1 }
        expect: { status: 200, body: { routes: [] } }
        save: { nobody: body.accessToken }
      - GET: /api/students
        auth: nobody
        expect: { status: 403 }
      - GET: /api/courses
        auth: nobody
        expect: { status: 403 }

  - id: ACC-T31
    title: Sign-up rejects a duplicate email (409) and missing fields (400)
    req: [REQ-014.AC4]
    steps:
      - POST: /api/users/signup
        body: { email: "dup-{{uniq}}@sonata.test", password: pw-123456 }
        expect: { status: 201 }
        save: { email: body.email }
      - POST: /api/users/signup
        body: { email: "{{email}}", password: other-123456 }
        expect: { status: 409, body: { $shape: error } }
      - POST: /api/users/signup
        body: { password: pw-123456 }
        expect: { status: 400, body: { $shape: error, details: { $has: [ { field: email } ] } } }
      - POST: /api/users/signup
        body: { email: "nopw-{{uniq}}@sonata.test" }
        expect: { status: 400, body: { $shape: error, details: { $has: [ { field: password } ] } } }
