area: Platform - error format and schema (new contract)
suite: target
background:
  - use: root

cases:
  - id: PLT-T01
    title: Not-found and conflict errors use the standard error body
    req: [REQ-005.AC1, REQ-005.AC3]
    steps:
      - GET: /api/students/999999
        auth: root
        expect: { status: 404, body: { $shape: error, status: 404 } }
      - POST: /api/courses
        auth: root
        body: { name: Violin }
        expect: { status: 201 }
      - POST: /api/courses
        auth: root
        body: { name: Violin }
        expect: { status: 409, body: { $shape: error, status: 409, details: [] } }

  - id: PLT-T02
    title: Validation errors list every invalid field
    req: [REQ-005.AC2]
    steps:
      - POST: /api/courses
        auth: root
        body: { name: Violin }
        expect: { status: 201 }
      - POST: /api/fee-structures
        auth: root
        body: { courseName: Violin, termsPerYear: 5, terms: [] }
        expect:
          status: 400
          body:
            $shape: error
            details:
              $has:
                - { $shape: fieldError, field: name }
                - { $shape: fieldError, field: termsPerYear }

  - id: PLT-T03
    title: A malformed request body gives 400 without internal details
    req: [REQ-005.AC3]
    steps:
      - POST: /api/students
        auth: root
        rawBody: '{"studentName": "Asha", '
        expect:
          status: 400
          body:
            $shape: error
            message: { $not: { $contains: jackson } }

  - id: PLT-T04
    title: An unexpected server error never leaks a stack trace or SQL
    req: [REQ-005.AC3]
    steps:
      - GET: /api/students/not-a-number
        auth: root
        expect:
          status: 400
          body:
            $shape: error
            message: { $not: { $regex: "(?i)exception|java\\.|select |numberformat" } }

  - id: PLT-T05
    title: On an empty database every migration runs, starting with the production baseline as real SQL
    req: [REQ-006.AC1, REQ-006.AC2]
    steps:
      - sql: >
          SELECT (SELECT type FROM flyway_schema_history WHERE version = '1') AS v1_type,
                 count(*) AS applied, count(*) FILTER (WHERE NOT success) AS failed
          FROM flyway_schema_history
        expect:
          rows: [ { v1_type: SQL, applied: { $gte: 2 }, failed: 0 } ]
