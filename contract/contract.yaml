# How the runner starts the backend under test and reaches its database.
# Swap `server` to test a backend written in another language: the specs don't change.

baseUrl: http://localhost:18080

server:
  build: ./mvnw -q -DskipTests package
  start: java -jar target/sonata-brain-0.0.1-SNAPSHOT.jar
  ready: /heartbeat            # polled until it answers 200
  readyTimeout: 120s
  env:
    SERVER_PORT: "18080"
    DB_URL: jdbc:postgresql://localhost:5432/sonata-contract
    DB_USERNAME: sandeepsj
    DB_PASSWORD: sonata123
    SPRING_JPA_SHOW_SQL: "false"
    LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: INFO
    # Target contract (REQ-015): first admin, created by the backend at startup.
    SONATA_BOOTSTRAP_ADMIN_EMAIL: root@sonata.test
    SONATA_BOOTSTRAP_ADMIN_PASSWORD: root-password-1

database:                      # local PostgreSQL only; dropped and recreated at the start of each run
  host: localhost
  port: 5432
  name: sonata-contract
  user: sandeepsj
  password: sonata123
  # Emptied before every case, except these tables (migration history and access control,
  # so the bootstrap admin survives). Cases that create users or roles use {{uniq}} names.
  preserveTables: [flyway_schema_history, account, role, role_permission, user_roles]

requirements: ../docs/requirements   # where acceptance criteria are defined
