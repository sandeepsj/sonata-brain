# NEW model: one course with a quarterly fee structure on the timeline for all of last year, and one student
# enrolled for (almost) the whole of last year. All dates are in the past, so results don't depend on the run date.
# Needs {{root}} (use: root first).
#
#   Course Violin
#   Fee structure "Violin quarterly": term 1 = 1000, 2 = 1000, 3 = 1200, 4 = 1200   -> {{quarterly}}
#   Timeline entry: quarterly from {{year -1}}-01-01 to {{year -1}}-12-31            -> {{entry}}
#   Student Asha -> {{asha}}, enrolled 10 Jan {{year -1}} to 20 Dec {{year -1}}       -> {{sid}}
#
# Expected dues for Asha: 4 quarters of last year (Jan-Mar 1000, Apr-Jun 1000, Jul-Sep 1200, Oct-Dec 1200).
steps:
  - POST: /api/courses
    auth: root
    body: { name: Violin }
    expect: { status: 201 }
  - POST: /api/fee-structures
    auth: root
    body:
      name: Violin quarterly
      courseName: Violin
      termsPerYear: 4
      terms:
        - { termNumber: 1, amount: 1000 }
        - { termNumber: 2, amount: 1000 }
        - { termNumber: 3, amount: 1200 }
        - { termNumber: 4, amount: 1200 }
    expect: { status: 201 }
    save: { quarterly: body.id }
  - POST: /api/fee-timeline
    auth: root
    body: { courseName: Violin, feeStructureId: "{{quarterly}}", effectiveFrom: "{{year -1}}-01-01", effectiveTo: "{{year -1}}-12-31" }
    expect: { status: 201 }
    save: { entry: body.id }
  - POST: /api/students
    auth: root
    body: { studentName: Asha }
    expect: { status: 201 }
    save: { asha: body.admissionNo }
  - POST: /api/student-sessions
    auth: root
    body:
      studentId: "{{asha}}"
      courseName: Violin
      dateOfJoining: "{{year -1}}-01-10T10:00:00"
      dateOfDisjoining: "{{year -1}}-12-20T10:00:00"
    expect: { status: 201 }
    save: { sid: body.id }
  - GET: /api/dues
    eventually: 10s
    auth: root
    query: { studentId: "{{asha}}" }
    expect: { status: 200, body: { $len: 4 } }
