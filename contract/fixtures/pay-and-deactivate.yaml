# Pay a course fee with a discount, then deactivate it straight away. Both calls must succeed.
# Needs {{root}}, {{asha}} and Violin on the timeline for {{period}} (use: enrolment).
params:
  period: "2025-02-15"
steps:
  - POST: /api/payments
    auth: root
    body:
      studentId: "{{asha}}"
      paymentType: REGULAR
      courseName: Violin
      periodDate: "{{period}}"
      amountPaid: 300
      label: Course fee
      discounts: [ { discountAmount: 100, label: Sibling } ]
    expect: { status: 201 }
    save: { _pid: body.id }
  - PATCH: /api/payments/{{_pid}}/deactivate
    auth: root
    expect: { status: 200, body: { isActive: false } }
