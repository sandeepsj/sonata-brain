# NEW access model: log in as the bootstrap administrator (REQ-015), who holds the built-in ADMIN role.
# Never give ADMIN to any other user in a spec: REQ-013.AC4 relies on root being the only admin.
# Saves: {{root}} = access token, {{rootRefresh}} = refresh token.
steps:
  - POST: /api/auth/login
    body: { email: root@sonata.test, password: root-password-1 }
    expect: { status: 200 }
    save:
      root: body.accessToken
      rootRefresh: body.refreshToken
