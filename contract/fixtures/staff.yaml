# NEW access model: create a staff user holding one new role with the given routes, and log in.
# Needs {{root}} (use: root first).
#
#   - use: staff
#     with: { as: reader, routes: [ { path: /api/students/**, read: true, write: false } ] }
#
# Saves: {{<as>}} = access token, {{<as>Refresh}} = refresh token, {{<as>Id}} = user id, {{<as>RoleId}} = role id.
params:
  as: staff
  routes: []
steps:
  - POST: /api/roles
    auth: root
    body: { name: "{{as}}-role-{{uniq}}", description: Role for a contract case, routes: "{{routes}}" }
    expect: { status: 201 }
    save: { _role: body.id }
  - POST: /api/users/signup
    body: { email: "{{as}}-{{uniq}}@sonata.test", password: staff-password-1 }
    expect: { status: 201 }
    save: { _uid: body.id, _email: body.email }
  - PUT: /api/users/{{_uid}}/roles
    auth: root
    body: { roleIds: [ "{{_role}}" ] }
    expect: { status: 200 }
  - POST: /api/auth/login
    body: { email: "{{_email}}", password: staff-password-1 }
    expect: { status: 200 }
    save: { _token: body.accessToken, _refresh: body.refreshToken }
  - set:
      "{{as}}": "{{_token}}"
      "{{as}}Refresh": "{{_refresh}}"
      "{{as}}Id": "{{_uid}}"
      "{{as}}RoleId": "{{_role}}"
