# Log in as an administrator for the baseline suite.
# Originally this set account.scope = 'ANY' in SQL. Since the roles model (REQ-011/012) it logs in as the
# bootstrap administrator (REQ-015), which holds ADMIN. Only the way of getting a token changed; the baseline
# cases still check the same behaviour of everything else.
# Saves: {{admin}} = access token, {{adminRefresh}} = refresh token.
steps:
  - POST: /api/auth/login
    body: { email: root@sonata.test, password: root-password-1 }
    expect: { status: 200 }
    save:
      admin: body.accessToken
      adminRefresh: body.refreshToken
