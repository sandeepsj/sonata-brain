spring.application.name=sonata-brain
# Database Connection Details
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sonata-local}
spring.datasource.username=${DB_USERNAME:sandeepsj}
spring.datasource.password=${DB_PASSWORD:sonata123}

# Hibernate (JPA) Settings
# 'update' automatically creates/updates your tables based on your Java Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Logging Configuration
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Payment Logging Configuration (deprecated - use application.logging instead)
payment.logging.strategy=console
payment.logging.enabled=true

# Application-wide Logging Configuration
application.logging.strategy=console
application.logging.enabled=true
