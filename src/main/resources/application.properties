spring.application.name=sonata-brain
# Database Connection Details
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sonata-local}
spring.datasource.username=${DB_USERNAME:sandeepsj}
spring.datasource.password=${DB_PASSWORD:sonata123}

# Hibernate (JPA) Settings
# The schema is created and changed only by Flyway migrations (src/main/resources/db/migration).
# Hibernate just checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Production predates Flyway: an existing schema without history is recorded as version 1 (V1__baseline.sql).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true
# Load lazy/eager associations (a session's student and course, a payment's student, ...) in batches with
# WHERE id IN (...) instead of one query per row: list endpoints made hundreds of round trips to the database.
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Logging Configuration
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Payment Logging Configuration (deprecated - use application.logging instead)
payment.logging.strategy=console
payment.logging.enabled=true

# Application-wide Logging Configuration
application.logging.strategy=console
application.logging.enabled=true

# Generate your own 64-character random string for this
# You can use an online generator (e.g., "random 64-char hex string")
jwt.secret.key=${JWT_SECRET_KEY:a7f4c5e8a1d6b2c8d9e0f1a3b5c7d9e2f4a6b8c0d2e5f7a1b3c8d6e9f2a4b7c9}
# API docs (REQ-009): stable key order so docs/api/openapi.json diffs cleanly
springdoc.writer-with-order-by-keys=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
